<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sayfa Bulunamadı - Ayık Şoför</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
            font-family: 'Inter', system-ui, sans-serif;
            color: #f5f5f5;
            background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(212, 168, 67, 0.12), transparent 70%), #0a0a0a;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(5rem, 22vw, 9rem);
            line-height: 1;
            background: linear-gradient(135deg, #b58d32, #f0c761, #d4a843);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: float 4s ease-in-out infinite;
        }
        p { color: #a3a3a3; margin: 16px 0 32px; font-size: 1.05rem; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 52px;
            padding: 0 30px;
            border-radius: 999px;
            background: linear-gradient(135deg, #d4a843, #f0c761);
            color: #0a0a0a;
            font-weight: 600;
            text-decoration: none;
        }
        @keyframes float { 50% { transform: translateY(-10px); } }
        @media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>Aradığınız sayfa bulunamadı. Yolu biz bulalım.</p>
        <a href="/">Ana Sayfaya Dön</a>
    </main>
</body>
</html>
